name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compute version
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Build APK (release, arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64 -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
        env:
          KEYSTORE_PASSWORD: c3e1a6b62ef468645c20b963306bb0d6
          KEY_ALIAS: points_mall
          KEY_PASSWORD: c3e1a6b62ef468645c20b963306bb0d6

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: points-mall-apk
          path: build/app/outputs/flutter-apk/*.apk
