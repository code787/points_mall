name: points_mall
description: 积分兑换系统 - 支持积分登记、物品管理、兑换审核、库存与数据统计
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: 2.1.4
  path_provider_android: 2.2.23
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  intl: ^0.19.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
